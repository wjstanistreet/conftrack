# Escape hatch: run the whole app with no Docker at all.
#   ./gradlew bootRun --args='--spring.profiles.active=h2'
# The same migrations run, so every station reproduces identically.
spring:
  datasource:
    url: jdbc:h2:mem:conftrack;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ''

  flyway:
    locations: classpath:db/migration/common,classpath:db/migration/h2

  docker:
    compose:
      enabled: false

  h2:
    console:
      enabled: true
      path: /h2-console
