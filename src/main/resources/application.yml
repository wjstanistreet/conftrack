spring:
  application:
    name: conftrack

  datasource:
    url: jdbc:postgresql://localhost:5432/conftrack
    username: conftrack
    password: conftrack

  jpa:
    hibernate:
      # Deliberately 'none' rather than 'validate': see docs/stations/STATION-03.md.
      # With 'validate' the schema check can fire before the bean wiring error of
      # Station 1, which would spoil the running order.
      ddl-auto: none
    open-in-view: false

  flyway:
    locations: classpath:db/migration/common,classpath:db/migration/postgres

  docker:
    compose:
      enabled: true
      file: compose.yaml

  main:
    # Legacy setting inherited from the service this was copied from.
    allow-bean-definition-overriding: true

  # ---- STATION 05 - BLOCK C - "The right code, the wrong bean" ---------------
  # Found with : the Spring Debugger. Expanding this.scorer showed the actual
  #              instance was LenientFeedbackScorer, not the class we qualified by
  #              name in Station 01; Alt+F8 on scorer.describe() made the running
  #              application say so out loud. The context view also showed
  #              lowRatingWeight resolving to 1.0 rather than its 1.5 default.
  # Fixed by   : no longer including the "local" profile, which removes both
  #              LocalScoringConfig's bean override and application-local.yml.
  #              It used to be included here:
  #                profiles:
  #                  include: local
  # Why        : every file was correct on its own. The bug only existed in what Spring
  #              assembled at runtime, which reading the code cannot show.
  # Notes      : docs/stations/STATION-05.md

conftrack:
  feedback:
    # ---- STATION 02 - BLOCK A - "Nobody knows the key names" -----------------
    # Found with : Spring configuration completion in YAML. Ctrl+Space under
    #              conftrack.feedback offered the keys of our own
    #              @ConfigurationProperties class, with their types and defaults.
    #              Ctrl+click jumps from a key to the field in FeedbackProperties
    #              that it binds to.
    # Fixed by   : adding the two settings ticket 02 asks for.
    # Why        : configuration fails silently: a missing or misspelt key is not an
    #              error. These keys were invented by this team, so no docs list them.
    # Proof      : GET /api/dashboard/settings shows minimumRating 2, recentDays 7.
    # Notes      : docs/stations/STATION-02.md
    minimum-rating: 2
    recent-days: 7

  api:
    # Demo credentials for the QA login in requests/feedback.http. Never real ones.
    qa-password: conftrack-qa

  venue:
    # ---- STATION 09 - BLOCK F - "The new API isn't live yet" -----------------
    # Found with : the WireMock plugin's run configuration, which serves the stubs
    #              generated from specs/venue-api.yaml. Its port goes here.
    # Fixed by   : pointing at the WireMock stub until the real Venue API is live.
    #              On go-live this goes back to https://venue.internal.example.com.
    # Proof      : GET /api/rooms shows a capacity for all four rooms.
    # Notes      : docs/stations/STATION-09.md
    base-url: http://localhost:8089

management:
  endpoints:
    web:
      exposure:
        include: health,info,beans,env,configprops,metrics

server:
  port: 8080
